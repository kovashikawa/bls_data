[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bls-data"
version = "0.2.0"
description = "Clean Python toolkit for BLS time-series data — API client, parser, mapping, and MCP server"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Rafael Kovashikawa"}]
keywords = ["bls", "bureau-of-labor-statistics", "economics", "api", "time-series", "cpi", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
plot = ["matplotlib>=3.7"]

[project.scripts]
bls-mcp = "bls_data.server:run"

[project.urls]
Homepage = "https://github.com/kovashikawa/bls_data"
Repository = "https://github.com/kovashikawa/bls_data.git"

[tool.hatch.build.targets.wheel]
packages = ["src/bls_data"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "C4", "UP", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]